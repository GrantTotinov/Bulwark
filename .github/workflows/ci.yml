name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test -c Release --no-build
      - run: dotnet format --verify-no-changes
      - name: Pack
        run: |
          dotnet pack src/Bulwark.AspNetCore.Analyzers -c Release --no-build -o artifacts
          dotnet pack src/Bulwark.Cli -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/*.nupkg
